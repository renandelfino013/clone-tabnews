name: testes automatizados

on: pull_request

jobs: 
  jest: 
    name: jest ubuntu
    runs_on: ubuntu-latest
    steps:
      - uses: actions/Checkout@v4
      
      - uses: actions/setup-node@4
        with:
        node-version: "lts/hydrogen"

      - run: npm ci  
      
      - run: npm test  